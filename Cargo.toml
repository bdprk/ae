[package]
name = "ae"
version = "0.1.1"
edition = "2024"

[dependencies]
ae-compiler = { path = "crates/ae-compiler" }
ae-syntax = { path = "crates/ae-syntax" }
ae-resolve = { path = "crates/ae-resolve" }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[workspace]
members = ["crates/ae-compiler", "crates/ae-syntax", "crates/ae-resolve", "crates/ae-span", "crates/ae-ty"]
default-members = [".", "crates/ae-compiler", "crates/ae-syntax", "crates/ae-resolve", "crates/ae-span", "crates/ae-ty"]
resolver = "3"
