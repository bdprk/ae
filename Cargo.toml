[package]
name = "ae"
version = "0.1.1"
edition = "2024"

[dependencies]
ae-compiler = { path = "crates/ae-compiler" }
ae-syntax = { path = "crates/ae-syntax" }
ae-resolve = { path = "crates/ae-resolve" }
ae-hir = { path = "crates/ae-hir" }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[workspace]
members = ["crates/ae-compiler", "crates/ae-syntax", "crates/ae-resolve", "crates/ae-span", "crates/ae-ty", "crates/ae-hir", "crates/ae-mir", "crates/ae-layout", "crates/ae-query", "crates/ae-codegen-c", "crates/ae-lsp"]
default-members = [".", "crates/ae-compiler", "crates/ae-syntax", "crates/ae-resolve", "crates/ae-span", "crates/ae-ty", "crates/ae-hir", "crates/ae-mir", "crates/ae-layout", "crates/ae-query", "crates/ae-codegen-c", "crates/ae-lsp"]
resolver = "3"
