name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build and registry
        uses: Swatinem/rust-cache@v2
      - name: Check C compiler
        run: gcc --version
      - name: Test verification scripts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Byte-parity gate vs the previous main (M0.2.08)
        if: github.event_name == 'pull_request'
        run: python scripts/ab_gate.py --baseline "${{ github.event.pull_request.base.sha }}"
      - name: Master checklist is current (R5.1)
        run: |
          python scripts/gen_checklist.py
          git diff --exit-code docs/checklist.md
      - name: Standard library layering (R4.1)
        run: python scripts/std_layering.py
      - name: Commit titles record their ledger work (R5.1)
        if: github.event_name == 'pull_request'
        run: python scripts/check_commit_ids.py --base "${{ github.event.pull_request.base.sha }}"
      - name: Clippy
        # Reporting gate: `-W clippy::all` surfaces the debt list in
        # docs/implementation-ledger.md §7 without failing the build while
        # that list is still being paid down. Tighten to `-D warnings` as
        # the audit's P0 items land.
        run: cargo clippy --workspace --all-targets -- -W clippy::all
      - name: Test
        run: cargo test --workspace --locked
      - name: Verify generated C (Linux sanitizers)
        if: runner.os == 'Linux'
        run: python3 scripts/verify_generated_c.py --sanitize
      - name: Verify generated C (Windows leak checks)
        if: runner.os == 'Windows'
        run: python scripts/verify_generated_c.py --leak
