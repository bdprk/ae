name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build and registry
        uses: Swatinem/rust-cache@v2
      - name: Check C compiler
        run: gcc --version
      - name: Test verification scripts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Byte-parity gate vs the previous main (M0.2.08)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/ab_gate.py --baseline origin/${{ github.base_ref }}
      - name: Master checklist is current (R5.1)
        run: |
          python scripts/gen_checklist.py
          git diff --exit-code docs/checklist.md
      - name: Standard library layering (R4.1)
        run: python scripts/std_layering.py
      - name: Commit titles record their ledger work (R5.1)
        if: github.event_name == 'pull_request'
        run: python scripts/check_commit_ids.py --base origin/${{ github.base_ref }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Body-route coverage ratchet (P1.1)
        # The resolved-body route replaces the legacy parser slice by slice.
        # The fallback total must never rise between slices; bump the ceiling
        # only in a commit that lowers it (the ledger records both numbers).
        run: python scripts/route_report.py --max 0 --max-typed 8
      - name: Legacy-free files stay legacy-free (P1.1)
        # AE_DENY_LEGACY_ROUTE=1 turns any fallback into a diagnostic. The
        # manifest in scripts/deny_route.py lists the files the resolved
        # route already covers completely; it grows one file at a time.
        run: python scripts/deny_route.py
      - name: Robustness sweep (P0.4 audit gate)
        # 50,000 mutated sources through the real check entry: malformed
        # input must produce a diagnostic, never a panic or a stack abort.
        run: cargo test -p ae-compiler --lib mutated_sources_never_panic_50k -- --ignored
      - name: Verify generated C (Linux sanitizers)
        if: runner.os == 'Linux'
        run: python3 scripts/verify_generated_c.py --sanitize
      - name: Verify generated C (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_generated_c.py --leak
