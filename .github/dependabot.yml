version: 2

# The workspace pins `Cargo.lock` and CI builds with `--locked`, so a stale
# lock is invisible until something makes it urgent. One grouped PR a week
# keeps the single external dependency (`toml`) and the pinned actions current.

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
